name: Build StepCash Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STEPCASH_URL: ${{ vars.STEPCASH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Add app icon and splash screen
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/mipmap-anydpi-v26
          rm -f $R/drawable/splash.png
          cat > $R/drawable/splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#0B0F0C"/>
          </shape>
          EOF
          cat > $R/drawable/ic_stepcash_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="7" android:strokeLineCap="round" android:pathData="M66,40 C66,34 60,31 54,31 C47,31 42,35 42,41 C42,48 49,50 54,52 C60,54 67,56 67,64 C67,70 61,74 54,74 C47,74 41,71 41,65"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M54,24 L54,82"/>
          </vector>
          EOF
          for f in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$f.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_stepcash_fg"/>
          </adaptive-icon>
          EOF
          done
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StepCash-APK
          path: android/app/build/outputs/apk/debug/*.apk
